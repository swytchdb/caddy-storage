name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GOWORK: "off"
  GOFLAGS: -mod=readonly

jobs:
  xcaddy:
    name: Build latest Caddy with Swytch storage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # xcaddy creates a temporary module and resolves its dependencies.
      GOFLAGS: -mod=mod
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Install xcaddy
        run: go install github.com/caddyserver/xcaddy/cmd/xcaddy@v0.4.6
      - name: Build latest Caddy with this checkout
        run: xcaddy build latest --with "github.com/swytchdb/caddy-storage=${GITHUB_WORKSPACE}" --output "${RUNNER_TEMP}/caddy"
      - name: Verify storage module registration
        shell: bash
        run: |
          "${RUNNER_TEMP}/caddy" version
          "${RUNNER_TEMP}/caddy" list-modules | grep -Fx 'caddy.storage.swytch'

  checks:
    name: Formatting, dependencies, and vet
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Check formatting
        shell: bash
        run: |
          unformatted=$(gofmt -l .)
          if [[ -n "$unformatted" ]]; then
            printf 'Run gofmt on these files:\n%s\n' "$unformatted"
            exit 1
          fi
      - name: Check module tidiness
        run: go mod tidy -diff
      - name: Verify dependencies
        run: go mod verify
      - name: Vet
        run: go vet ./...

  build-test:
    name: Build and race tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Build
        run: go build ./...
      - name: Test with race detection and coverage
        run: go test -race -count=1 -timeout=5m -coverprofile=coverage.out ./...
      - name: Upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.out
          if-no-files-found: error
